name: Offline License Engine CI

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "windows/Licensing/**"
      - "windows/Launcher.cs"
      - "src/licensing/**"
      - "src/main.tsx"
      - "src/index.css"
      - "package.json"
      - "windows/build-exe.ps1"
      - "tests/licensing/**"
      - "supabase/**"
      - ".github/workflows/license-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-license-engine:
    runs-on: windows-latest
    name: Compile Windows license engine and run crypto tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build launcher and run Ed25519 tests
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File windows/build-exe.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows license engine build failed: $LASTEXITCODE" }

      - name: Upload compiled test evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-license-self-test
          path: |
            bin/LicenseCryptoSelfTest.exe
            bin/BouncyCastle.Cryptography.dll
          retention-days: 7

  supabase-canonical-tests:
    runs-on: ubuntu-latest
    name: Verify Supabase signing format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run canonical signing interoperability test
        run: deno test supabase/functions/tests/license-canonical.test.ts

      - name: Type-check license issuance and administration functions
        run: |
          deno check supabase/functions/issue-license/index.ts
          deno check supabase/functions/list-licenses/index.ts
          deno check supabase/functions/revoke-license/index.ts

  react-windows-gate:
    runs-on: ubuntu-latest
    name: Type-check and build React Windows activation gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vjwmocxrqxdybaijhsuo.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.PUBLISH_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.PUBLISH_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npm run build
